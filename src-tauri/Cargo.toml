[package]
name = "app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chrono = "0.4.45"
reqwest = { version = "0.13.4", features = ["gzip", "json", "native-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
toml = "0.9.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time", "macros", "io-util", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
png = "0.17.16"
